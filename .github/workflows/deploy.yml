name: Deploy Galaxy Point PWA Testing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: galaxy-point-pwa-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
      - name: Generate PNG app icons
        run: |
          python3 -m pip install --user cairosvg
          python3 - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              filename = 'apple-touch-icon-v4.png' if size == 180 else f'gp-icon-{size}-v4.png'
              cairosvg.svg2png(url='pwa-icon.svg', write_to=filename, output_width=size, output_height=size)
              print('Generated official GP logo:', filename)
          PY
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy PWA
        id: deployment
        uses: actions/deploy-pages@v4
